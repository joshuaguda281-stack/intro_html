<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>
    <!-- ctrl+/ -->
     <!-- unordered list -->
      <ul>

        type="1"  <!-- numbers -->

        <li>Item 2</li>

        <li>london</li>
        <li>nairobi</li>
