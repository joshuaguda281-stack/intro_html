<!DOCTYPE html>
<html lang="en-ke">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links or anchors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        a {
            display: block;
            margin-bottom: 10px;
            text-decoration: none;
            color: blue;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="https://www.example.com">Visit Example</a>
    <br>
    <a href="https://www.google.com" target="_blank">Visit Google in New Tab</a>
    <br>
    <a href="https://www.wikipedia.org" target="_self">Visit Wikipedia in Same Tab</a>
    <br>
    <a href="https://www.github.com" target="_blank">Visit GitHub in New Tab</a>
    <br>
    <a href="https://www.stackoverflow.com" target="_self">Visit Stack Overflow in Same Tab</a>
    <br>
    <a href="https://www.reddit.com" target="_blank">Visit Reddit in New Tab</a>
    <br>
</body>
</html>
