<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Navigation Bar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Edu+QLD+Hand:wght@400..700&family=Great+Vibes&family=Nabla&display=swap');

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            /* background-color: #333; */
            overflow: hidden;
        }

        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #3fc7ea;
        }
        .content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            max-width: 1200px;
        }
        .logo img {
            height: 150px;
            width: auto;
        }
        .content ul {
            display: flex;
            list-style-type: none;
            /* remove bullet points */
        }
        .content li {
            margin: 0 10px;
        }
        .content a {
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            text-transform: capitalize;
        }
        .content a:hover {
            color: #000;
            background-color: #fff;
            padding: 12px 20px;
            border-radius: 5px;
        }
        /* git add . */
        /* git commit -m "Update navigation bar" */
        /* git push */
    </style>
</head>
<body>
    <nav>
        <div class="content">
            <div class="logo">
                <img src="images/delivery-truck_12731514.png" alt="logo" width="50%" height="50%">
            </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">Sign Up</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
        </div>
    </nav>
    <header>
        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <footer>
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </footer>
</body>

</html>
